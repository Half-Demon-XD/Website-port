<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/style/style.css"> <!--Linking the CSS-->
    <title>Title XD</title>
    <link rel="icon" type="image/png" href="/images/logo.png"> <!-- Favicon-->
</head>
<body>
    <div class="bgimage"></div>

    <div class="top-bar">
        <!-- logo on right -->
        <a href="index.html"><img src="/images/logo.png" alt="Website Logo" class="logo"></a>
    </div>

    <div class="signup-form">
        <h2>Sign Up</h2>
        <form action="/submit_signup" method="post">
            <input type="username" id="username" name="username" required placeholder="Username"><br><br>
            <input type="email" id="email" name="email" required placeholder="Email"><br><br>
            <input type="password" id="password" name="password" required placeholder="Password"><br><br>
            <input type="submit" value="Sign Up" class="signupformsubbtn">
        </form>
 
</body>
</html>
